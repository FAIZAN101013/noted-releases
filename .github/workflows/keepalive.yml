name: Keep API awake

# Render's free tier sleeps after 15 idle minutes; this pings the health
# endpoint every 10 minutes so the Noted API stays responsive.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          curl -fsS -m 60 https://noted-api-orcm.onrender.com/health && echo "API awake" || echo "Ping failed (server may be waking)"
